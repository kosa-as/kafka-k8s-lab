apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-log-sidecar-injector
  namespace: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-log-sidecar-injector
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-log-sidecar-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-log-sidecar-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-log-sidecar-injector
    spec:
      serviceAccountName: kafka-log-sidecar-injector
      containers:
        - name: injector
          image: kafka-log-sidecar-injector:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: kafka-log-sidecar-injector-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-log-sidecar-injector
  namespace: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka-log-sidecar-injector
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kafka-log-sidecar-injector
webhooks:
  - name: kafka-log-sidecar-injector.kafka.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    clientConfig:
      service:
        name: kafka-log-sidecar-injector
        namespace: kafka
        path: /mutate
        port: 443
      caBundle: ""
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kafka
    objectSelector:
      matchLabels:
        strimzi.io/cluster: kafka
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
