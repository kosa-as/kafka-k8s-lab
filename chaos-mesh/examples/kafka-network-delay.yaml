# Example only. Applying this file immediately injects a 60-second delay.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: kafka-0-network-delay
  namespace: kafka
spec:
  action: delay
  mode: one
  selector:
    pods:
      kafka:
        - bitnami-kafka-controller-0
  direction: to
  target:
    mode: all
    selector:
      pods:
        kafka:
          - bitnami-kafka-controller-1
          - bitnami-kafka-controller-2
  delay:
    latency: 200ms
    jitter: 20ms
    correlation: "0"
  duration: 60s
