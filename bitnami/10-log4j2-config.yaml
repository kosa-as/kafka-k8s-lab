apiVersion: v1
kind: ConfigMap
metadata:
  name: bitnami-kafka-log4j2
  namespace: kafka
data:
  log4j2.yaml: |
    Configuration:
      Appenders:
        Console:
          name: STDOUT
          PatternLayout:
            pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n"
        RollingFile:
          name: KAFKA_FILE
          fileName: /opt/bitnami/kafka/logs/server.log
          filePattern: /opt/bitnami/kafka/logs/server-%i.log.gz
          PatternLayout:
            pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n"
          Policies:
            SizeBasedTriggeringPolicy:
              size: 100MB
          DefaultRolloverStrategy:
            max: 10
      Loggers:
        Root:
          level: INFO
          AppenderRef:
            - ref: STDOUT
            - ref: KAFKA_FILE
        Logger:
          - name: kafka.request.logger
            level: WARN
          - name: kafka.network.RequestChannel$
            level: WARN
